<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="icon" type="image/png" rel="noopener" target="_blank" href="../../ε.png"></head>
</head>
<body>
     <button onclick="saveContent()">Save Content</button>
      &nbsp; &nbsp; &nbsp;File:  <input type="text" id="fileName" value="a.txt"><br>
    <div contenteditable="true" id="editableContent" style="border: 1px solid #ccc; padding: 10px; font-family: Monaco, 'Courier New', monospace;  width: 100%; height: 100%; font-size: 16px;">
    </div>
    <br>

    <script>
      const currentDate = new Date();
      const ymd = currentDate.toISOString().substring(0, 10) +'.txt';
      document.getElementById("fileName").value = ymd;
        function saveContent() {
            const content = document.getElementById("editableContent").innerText; // Get the content of the editable div
            const blob = new Blob([content], { type: "text/plain;charset=utf-8" }); // Create a Blob with the content
            const link = document.createElement("a"); // Create a link element
            link.href = URL.createObjectURL(blob); // Create a URL for the Blob
            const fileName = document.getElementById("fileName").value;
            link.download = fileName; // Set the file name for download
            link.click(); // Trigger the download
        }
        document.addEventListener('keydown', function(event) {
            // Check if Ctrl (or Cmd on Mac) and S are pressed together
            if ((event.ctrlKey || event.metaKey) && event.key === 's') {
                event.preventDefault();  // Prevent the default "Save" behavior
                saveContent();
            }
        });
    </script>
    <!--generated by chatGPT-->
</body>
</html>
