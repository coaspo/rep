        const dimensionKeys = ['powerDistance', 'individualism', 'masculinity', 'uncertaintyAvoidance', 'longTermOrientation'];
        const dimensionLabels = ['Power-Distance-Index', 'Individualism', 'Masculinity', 'Uncertainty-Avoidance', 'Long-Term-Orientation'];
        const colors = ['#e41a1c', '#377eb8', '#4daf4a', '#984ea3', '#ff7f00', '#ffff33', '#a65628', '#f781bf', '#999999', '#66c2a5', '#fc8d62', '#8da0cb', '#e78ac3', '#a6d854', '#ffd92f', '#1b9e77', '#d95f02', '#7570b3', '#e6ab02', '#66a61e', '#d95d49', '#75a3df', '#ea6153', '#67b863', '#e7298a', '#a6761d', '#6a3d9a', '#b15928', '#fbb4ae', '#b3cde3', '#ccebc5', '#decbe4', '#fed9a6', '#ffffcc', '#e5d8bd', '#fddaec', '#f2f2f2', '#b3e2cd', '#fdcdac', '#cbd5e8', '#f4cae4', '#e6f5c9', '#fff2ae', '#a1d76a', '#e31a1c', '#1f78b4', '#b2df8a', '#33a02c', '#fb9a99', '#e31a1c', '#fdbf6f', '#ff7f00', '#cab2d6', '#6a3d9a', '#ffff99', '#b15928'];

        function populateCountryList() {
            const selectElement = document.getElementById('selectedCountries');
            countryData.forEach((countryInfo, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = countryInfo.country;
                selectElement.appendChild(option);
            });
        }

        function compareCountries() {
            const selectElement = document.getElementById('selectedCountries');
            const canvas = document.getElementById('comparisonCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const selectedIndices = Array.from(selectElement.selectedOptions).map(option => parseInt(option.value));
            const selectedCountries = selectedIndices.map(index => countryData[index]);

            if (selectedCountries.length === 0) {
                ctx.fillText('Please select at least one country to compare.', 50, 50);
                return;
            }

            const numDimensions = dimensionKeys.length;
            const numSelectedCountries = selectedCountries.length;
            var barWidth = 30;
            var groupSpacing = 60;
            var barSpacing = 10;
            const startX = 50;
            const maxY = Math.max(...countryData.flatMap(country => dimensionKeys.map(key => country[key]))) * 1; // Scale Y-axis slightly
            const scaleY = canvas.height / maxY;
            const bottomPadding = 50;
            const graphHeight = canvas.height - bottomPadding;
            const groupWidth = (barWidth * numSelectedCountries) + (barSpacing * (numSelectedCountries - 1)) + groupSpacing;
            const startY = graphHeight;

            // Adjust bar width and spacing if needed to fit
            const availableWidth = canvas.width - 2 * startX;
            const totalGroupWidth = groupWidth * numDimensions;

            if (totalGroupWidth > availableWidth) {
                const ratio = availableWidth / totalGroupWidth;
                barWidth *= ratio;
                barSpacing *= ratio;
                groupSpacing *= ratio;
            }

            let currentX = startX;
            const totalBarWidth = (barWidth * numSelectedCountries) + (barSpacing * (numSelectedCountries - 1));

            for (let i = 0; i < numDimensions; i++) {
                const dimensionKey = dimensionKeys[i];
                const dimensionLabel = dimensionLabels[i];

                for (let j = 0; j < numSelectedCountries; j++) {
                    const country = selectedCountries[j];
                    const value = country[dimensionKey];
                    const barHeight = value * scaleY;
                    const barY = startY - barHeight;
                    const barX = currentX + (j * (barWidth + barSpacing));

                    ctx.fillStyle = colors[selectedIndices[j] % colors.length];
                    ctx.fillRect(barX, barY, barWidth, barHeight);

                    // Label the bar with the country name (try to fit)
                    ctx.fillStyle = 'black';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    const textWidth = ctx.measureText(country.country).width;
                    const textX = barX + (barWidth / 2);
                    const textY = startY + 15;

                    if (textWidth <= barWidth * 1.5) {
                        ctx.fillText(country.country, textX, textY);
                    } else if (numSelectedCountries < 5) {
                        // If fewer countries, try a shorter label
                        ctx.fillText(country.country.split('-').pop(), textX, textY);
                    }
                }

                // Label the group
                ctx.fillStyle = 'black';
                ctx.font = '12px bold sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(dimensionLabel, currentX + (totalBarWidth / 2), startY + 30 + (numSelectedCountries > 0 ? 15 : 0)); // Adjust Y position based on country labels

                currentX += groupWidth;
            }

            // Draw Y-axis labels (approximate)
            ctx.fillStyle = 'black';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'right';
            for (let y = 0; y <= maxY; y += Math.ceil(maxY / 5)) {
                const yPos = startY - (y * scaleY);
                ctx.fillText(y, startX - 15, yPos + 3);
            }

            // Draw Y-axis line
            ctx.beginPath();
            ctx.moveTo(startX - 10, startY);
            ctx.lineTo(startX - 10, startY - (maxY * scaleY));
            ctx.stroke();
        }
